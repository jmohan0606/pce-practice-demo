[project]
name = "pce-practice-demo"
version = "0.1.0"
description = "Practice Management Dashboard — TigerGraph + FastAPI + Next.js + Chroma + cdao Azure OpenAI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    # Round 5 task 6: the build's memory guard on Windows (`resource` is
    # Unix-only; without a fallback the 4 GB guard is inert mid-build)
    "psutil>=5.9",
]

[project.optional-dependencies]
# Live TigerGraph tiers (mock mode needs none of these)
graph = ["pyTigerGraph>=1.6"]
# RAG / document pipeline (Round B)
rag = ["chromadb>=0.5", "pdfplumber>=0.11", "pypdf>=4.0", "python-docx>=1.1", "python-pptx>=0.6"]
# Local embedding fallback (heavy; cdao is the primary path)
local-embeddings = ["sentence-transformers>=3.0"]
# Build-box LLM spot checks
claude = ["anthropic>=0.30"]
openai = ["openai>=1.30"]

[tool.uv]
package = false
